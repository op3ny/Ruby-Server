<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Registro - Ruby Auth</title>
</head>

<body>
  <div class="container">
    <h2>Ruby Auth</h2>
    <p>Crie sua conta para continuar</p>

    <form id="register-form">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
      </div>

      <button type="submit">Registrar</button>

      <div id="error-message" class="error-message"></div>
    </form>

    <div class="login-link">
      <a href="/login.html">Já tem uma conta? Faça login</a>
    </div>
  </div>

  <script>
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(";").shift();
    }

    function deleteCookie(name) {
      document.cookie = `${name}=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC; secure; samesite=strict`;
    }

    (async function () {
      const tokenAES = getCookie("tokenAES");

      if (tokenAES) {
        try {
          const response = await fetch(
            `/login?tokenReg=${encodeURIComponent(tokenAES)}`
          );
          const data = await response.json();

          if (data.status === "Success") {
            alert(
              "Opa, você tem uma conta definida, deseja continuar com ela ou autenticar-se com outra? (Confirme para continuar)"
            );
            alert(
              "Saiba que ao continuar, sua conta atual será desconectada. (Confirme para continuar)"
            );
            window.location.href = "/logout.html";
          }
        } catch (error) {
          console.error("Erro ao verificar login:", error);
        }
      }
    })();

    document
      .getElementById("register-form")
      .addEventListener("submit", async function (event) {
        event.preventDefault();

        const errorMessage = document.getElementById("error-message");
        errorMessage.textContent = "";

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
          const crypt1Response = await fetch(
            `/crypt1?email=${encodeURIComponent(email)}&senha=${encodeURIComponent(
              password
            )}`
          );
          const crypt1Data = await crypt1Response.json();

          if (!crypt1Data.jwtToken) {
            throw new Error("Erro ao conseguir o token um!");
          }

          const crypt2Response = await fetch(
            `/crypt2?email=${encodeURIComponent(email)}&senha=${encodeURIComponent(
              password
            )}&crypt1=${encodeURIComponent(crypt1Data.jwtToken)}`
          );
          const crypt2Data = await crypt2Response.json();

          if (!crypt2Data.tokenAES) {
            throw new Error("Erro ao conseguir o token AES do crypt2!");
          }

          const registerResponse = await fetch(
            `/register?tokenReg=${encodeURIComponent(crypt2Data.tokenAES)}`
          );
          const registerData = await registerResponse.json();

          if (registerData.status === "Error") {
            errorMessage.textContent = registerData.log;
          } else {
            window.location.href = "/login.html";
          }
        } catch (error) {
          console.error("Bah tchê, tivemos um errinho de leve aqui ó:", error);
          errorMessage.textContent =
            "Ocorreu um erro pá faze seu registro, pera um pouquinho ae.";
        }
      });
  </script>
</body>

</html>
